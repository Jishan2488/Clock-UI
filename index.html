<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glass dial · 2D animated clock</title>
    <!-- Font Awesome for toggle icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e0e5ec; /* neutral base, will be overridden by theme */
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background-color 0.6s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* main glass card */
        .clock-card {
            width: min(90vw, 600px);
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-radius: 48px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15), inset 0 0 30px rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
            animation: float 6s infinite alternate ease-in-out;
        }

        /* subtle floating animation for the card */
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-15px) scale(1.01); }
        }

        /* glowing ring behind the card (animated) */
        .glow-ring {
            position: absolute;
            width: 110%;
            height: 110%;
            top: -5%;
            left: -5%;
            background: radial-gradient(circle, rgba(120,180,255,0.2) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            z-index: -1;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(0.95); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        /* canvas where the 2D clock is drawn */
        #clockCanvas {
            width: 80%;
            height: auto;
            aspect-ratio: 1/1;
            display: block;
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2), inset 0 5px 15px rgba(255,255,255,0.3);
            transition: box-shadow 0.3s ease;
            background: transparent; /* actual dial drawn on canvas */
            cursor: pointer;
        }

        /* digital time with glass */
        .digital-time {
            margin-top: 20px;
            background: inherit;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.15);
            border-radius: 60px;
            padding: 10px 30px;
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: #1e1e2f;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.5s ease;
        }

        /* theme toggle button (glass orb) */
        #theme-toggle {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #2d2d44;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            z-index: 20;
            animation: wobble 5s infinite;
        }

        #theme-toggle:hover {
            transform: scale(1.18) rotate(10deg);
            border-color: rgba(255,255,255,0.9);
            box-shadow: 0 0 35px rgba(255,255,255,0.6);
        }

        @keyframes wobble {
            0%,100% { transform: translateY(0) rotate(0); }
            25% { transform: translateY(-5px) rotate(-5deg); }
            75% { transform: translateY(3px) rotate(5deg); }
        }

        /* dark mode body background */
        body.dark {
            background: #12121c;
        }

        body.dark .clock-card {
            background: rgba(20, 20, 30, 0.3);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 30px 50px rgba(0,0,0,0.5), inset 0 0 30px rgba(180,180,255,0.2);
        }

        body.dark .digital-time {
            background: rgba(0,0,0,0.25);
            color: #e0e0f0;
            border-color: rgba(255,255,255,0.15);
        }

        body.dark #theme-toggle {
            background: rgba(30,30,45,0.4);
            color: #d0d0ff;
            border-color: rgba(255,255,255,0.2);
        }

        /* animated decorative dots (floating around) */
        .dot-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(180, 200, 255, 0.6);
            box-shadow: 0 0 15px currentColor;
            transition: background 0.5s ease;
        }

        /* small credit */
        .credit {
            position: absolute;
            bottom: 20px;
            right: 30px;
            color: rgba(0,0,0,0.2);
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
            padding: 4px 15px;
            border-radius: 40px;
            background: rgba(255,255,255,0.1);
            z-index: 15;
        }
        body.dark .credit {
            color: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="clock-card">
        <div class="glow-ring"></div>
        <canvas id="clockCanvas" width="600" height="600"></canvas>
        <div class="digital-time" id="digitalClock">--:--:--</div>
    </div>

    <div id="theme-toggle">
        <i class="fas fa-sun" id="toggleIcon"></i>
    </div>
    <div class="credit">2D glass · animated rhythm</div>

    <script>
        (function() {
            // ---------- DOM elements ----------
            const canvas = document.getElementById('clockCanvas');
            const ctx = canvas.getContext('2d');
            const digitalDiv = document.getElementById('digitalClock');
            const toggleBtn = document.getElementById('theme-toggle');
            const toggleIcon = document.getElementById('toggleIcon');
            
            // ---------- theme colors (light / dark) ----------
            const lightPalette = {
                dialBase: '#f8faff',
                dialGradient1: '#eef2f9',
                dialGradient2: '#ffffff',
                hourMark: '#2d3a5e',
                minuteMark: '#9aaec9',
                hourHand: '#1f2b3f',
                minuteHand: '#2e3b4e',
                secondHand: '#d64045',
                handShadow: 'rgba(0,0,0,0.1)',
                dotRing: '#6688cc',
                centerDot: '#1f2b3f',
                digitalColor: '#1e1e2f',
            };

            const darkPalette = {
                dialBase: '#1a1f2f',
                dialGradient1: '#232838',
                dialGradient2: '#151a28',
                hourMark: '#cbd5f0',
                minuteMark: '#4a5568',
                hourHand: '#e2e8f0',
                minuteHand: '#b0c4de',
                secondHand: '#ff8a8f',
                handShadow: 'rgba(0,0,0,0.5)',
                dotRing: '#9f8be5',
                centerDot: '#cbd5f0',
                digitalColor: '#e0e0f0',
            };

            // current active palette (light as default)
            let currentPalette = { ...lightPalette };
            let targetPalette = lightPalette;
            let transitionProgress = 1.0; // 1 = fully in target
            let isDark = false;

            // ---------- clock animation variables ----------
            let lastTimestamp = 0;
            let angleOffset = 0; // for extra decorative rotation

            // ---------- canvas size settings ----------
            function resizeCanvas() {
                const container = canvas.parentElement;
                const w = container.clientWidth * 0.8; // 80% of card width
                canvas.style.width = w + 'px';
                canvas.style.height = w + 'px';
                canvas.width = w * 2; // for sharpness on retina
                canvas.height = w * 2;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ---------- helper: interpolate two hex colors ----------
            function lerpColor(c1, c2, t) {
                const r1 = parseInt(c1.slice(1,3), 16);
                const g1 = parseInt(c1.slice(3,5), 16);
                const b1 = parseInt(c1.slice(5,7), 16);
                const r2 = parseInt(c2.slice(1,3), 16);
                const g2 = parseInt(c2.slice(3,5), 16);
                const b2 = parseInt(c2.slice(5,7), 16);
                const r = Math.round(r1 + (r2 - r1) * t);
                const g = Math.round(g1 + (g2 - g1) * t);
                const b = Math.round(b1 + (b2 - b1) * t);
                return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
            }

            // ---------- update palette based on progress ----------
            function updatePalette(progress) {
                if (!isDark) progress = 1 - progress; // 0 = light, 1 = dark
                // progress is now 0..1 where 0=light, 1=dark
                currentPalette = {
                    dialBase: lerpColor(lightPalette.dialBase, darkPalette.dialBase, progress),
                    dialGradient1: lerpColor(lightPalette.dialGradient1, darkPalette.dialGradient1, progress),
                    dialGradient2: lerpColor(lightPalette.dialGradient2, darkPalette.dialGradient2, progress),
                    hourMark: lerpColor(lightPalette.hourMark, darkPalette.hourMark, progress),
                    minuteMark: lerpColor(lightPalette.minuteMark, darkPalette.minuteMark, progress),
                    hourHand: lerpColor(lightPalette.hourHand, darkPalette.hourHand, progress),
                    minuteHand: lerpColor(lightPalette.minuteHand, darkPalette.minuteHand, progress),
                    secondHand: lerpColor(lightPalette.secondHand, darkPalette.secondHand, progress),
                    handShadow: `rgba(0,0,0,${0.1 + progress * 0.4})`, // custom
                    dotRing: lerpColor(lightPalette.dotRing, darkPalette.dotRing, progress),
                    centerDot: lerpColor(lightPalette.centerDot, darkPalette.centerDot, progress),
                };
            }

            // initial set
            updatePalette(isDark ? 1 : 0);

            // ---------- draw the clock (all 2D elements) ----------
            function drawClock() {
                const now = new Date();
                const hours = now.getHours() % 12;
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                const milliseconds = now.getMilliseconds();

                // smooth hand angles
                const secAngle = (seconds + milliseconds / 1000) * 6 * Math.PI / 180;
                const minAngle = (minutes + seconds / 60) * 6 * Math.PI / 180;
                const hourAngle = (hours + minutes / 60) * 30 * Math.PI / 180;

                const w = canvas.width;
                const h = canvas.height;
                const radius = w * 0.4; // 80% of half
                const centerX = w / 2;
                const centerY = h / 2;

                ctx.clearRect(0, 0, w, h);

                // ---- glass effect background (dial) ----
                const gradient = ctx.createRadialGradient(centerX-20, centerY-20, radius*0.2, centerX, centerY, radius*1.2);
                gradient.addColorStop(0, currentPalette.dialGradient1);
                gradient.addColorStop(1, currentPalette.dialGradient2);
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = gradient;
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetX = 5;
                ctx.shadowOffsetY = 5;
                ctx.fill();
                ctx.shadowColor = 'transparent'; // reset for other drawings

                // outer glass rim (like a bezel)
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius+4, 0, 2*Math.PI);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 3;
                ctx.stroke();

                // minute marks (small dashes)
                for (let i = 0; i < 60; i++) {
                    const angle = i * 6 * Math.PI / 180;
                    const inner = radius * 0.88;
                    const outer = radius * 0.96;
                    const x1 = centerX + inner * Math.sin(angle);
                    const y1 = centerY - inner * Math.cos(angle);
                    const x2 = centerX + outer * Math.sin(angle);
                    const y2 = centerY - outer * Math.cos(angle);
                    
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.lineWidth = i % 5 === 0 ? 4 : 1.5;
                    ctx.strokeStyle = i % 5 === 0 ? currentPalette.hourMark : currentPalette.minuteMark;
                    ctx.shadowBlur = i % 5 === 0 ? 10 : 4;
                    ctx.shadowColor = currentPalette.handShadow;
                    ctx.stroke();
                }
                ctx.shadowColor = 'transparent';

                // ---- hour numbers (glass style) ----
                ctx.font = `bold ${radius*0.12}px 'Segoe UI', 'Arial', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 12;
                ctx.shadowColor = currentPalette.handShadow;
                for (let i = 1; i <= 12; i++) {
                    const angle = (i * 30 - 90) * Math.PI / 180;
                    const x = centerX + radius * 0.75 * Math.cos(angle);
                    const y = centerY + radius * 0.75 * Math.sin(angle);
                    ctx.fillStyle = currentPalette.hourMark;
                    ctx.fillText(i.toString(), x, y);
                }
                ctx.shadowColor = 'transparent';

                // ---- decorative rotating dots (extra animation) ----
                // use angleOffset to rotate them
                for (let j = 0; j < 12; j++) {
                    const dotAngle = j * 30 * Math.PI / 180 + angleOffset * 2;
                    const dotRadius = radius * 0.6;
                    const xDot = centerX + dotRadius * Math.cos(dotAngle);
                    const yDot = centerY + dotRadius * Math.sin(dotAngle);
                    
                    ctx.beginPath();
                    ctx.arc(xDot, yDot, radius*0.035, 0, 2*Math.PI);
                    ctx.fillStyle = currentPalette.dotRing;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = currentPalette.dotRing;
                    ctx.fill();
                }
                ctx.shadowColor = 'transparent';

                // ---- hands ----
                // hour hand
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(hourAngle);
                ctx.beginPath();
                ctx.moveTo(-radius*0.1, -radius*0.05);
                ctx.lineTo(radius*0.3, -radius*0.02);
                ctx.lineTo(radius*0.3, radius*0.02);
                ctx.lineTo(-radius*0.1, radius*0.05);
                ctx.closePath();
                ctx.fillStyle = currentPalette.hourHand;
                ctx.shadowBlur = 15;
                ctx.shadowColor = currentPalette.handShadow;
                ctx.fill();
                ctx.restore();

                // minute hand
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(minAngle);
                ctx.beginPath();
                ctx.moveTo(-radius*0.07, -radius*0.03);
                ctx.lineTo(radius*0.45, -radius*0.015);
                ctx.lineTo(radius*0.45, radius*0.015);
                ctx.lineTo(-radius*0.07, radius*0.03);
                ctx.closePath();
                ctx.fillStyle = currentPalette.minuteHand;
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.restore();

                // second hand (slim, with trail effect via shadow)
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(secAngle);
                ctx.beginPath();
                ctx.moveTo(-radius*0.05, -radius*0.01);
                ctx.lineTo(radius*0.6, -radius*0.01);
                ctx.lineTo(radius*0.6, radius*0.01);
                ctx.lineTo(-radius*0.05, radius*0.01);
                ctx.closePath();
                ctx.fillStyle = currentPalette.secondHand;
                ctx.shadowBlur = 20;
                ctx.shadowColor = currentPalette.secondHand;
                ctx.fill();
                ctx.restore();

                // center dot (glass effect)
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius*0.07, 0, 2*Math.PI);
                ctx.fillStyle = currentPalette.centerDot;
                ctx.shadowBlur = 20;
                ctx.shadowColor = currentPalette.centerDot;
                ctx.fill();
                ctx.shadowColor = 'transparent';
            }

            // ---------- digital time update ----------
            function updateDigital() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
                digitalDiv.textContent = timeStr;
            }

            // ---------- animation loop (draw + extra animations) ----------
            function animate(timestamp) {
                // handle theme transition
                if (transitionProgress < 1.0) {
                    transitionProgress += 0.015; // speed of transition
                    if (transitionProgress > 1.0) transitionProgress = 1.0;
                    updatePalette(transitionProgress);
                }

                // update angle offset for rotating dots (continuous spin)
                angleOffset += 0.002;
                
                // redraw clock with current palette & angles
                drawClock();
                
                // update digital every frame (but it's cheap)
                updateDigital();

                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);

            // also update digital every second as fallback
            setInterval(updateDigital, 200);

            // ---------- theme toggle logic ----------
            toggleBtn.addEventListener('click', () => {
                isDark = !isDark;
                targetPalette = isDark ? darkPalette : lightPalette;
                transitionProgress = 0.0; // start transition

                // switch icon and body class
                if (isDark) {
                    toggleIcon.className = 'fas fa-moon';
                    document.body.classList.add('dark');
                } else {
                    toggleIcon.className = 'fas fa-sun';
                    document.body.classList.remove('dark');
                }
            });

            // ---------- extra: floating dots behind (CSS) ----------
            // (already have glow-ring, but we can also add some randomness)
            // we'll create a few divs with class dot and animate them via CSS
            function createFloatingDots() {
                const dotRing = document.createElement('div');
                dotRing.className = 'dot-ring';
                for (let i = 0; i < 8; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    const size = Math.random() * 12 + 6;
                    dot.style.width = size + 'px';
                    dot.style.height = size + 'px';
                    dot.style.left = Math.random() * 100 + '%';
                    dot.style.top = Math.random() * 100 + '%';
                    dot.style.animation = `floatDot ${5 + Math.random()*5}s infinite alternate ease-in-out`;
                    dot.style.background = `rgba(${150 + Math.random()*100}, ${150 + Math.random()*100}, 255, 0.3)`;
                    dotRing.appendChild(dot);
                }
                document.querySelector('.clock-card').appendChild(dotRing);
            }
            createFloatingDots();

            // additional CSS keyframes for floating dots (injected)
            const styleSheet = document.createElement("style");
            styleSheet.textContent = `
                @keyframes floatDot {
                    0% { transform: translate(0,0) scale(1); opacity: 0.2; }
                    100% { transform: translate(20px, -30px) scale(1.3); opacity: 0.7; }
                }
            `;
            document.head.appendChild(styleSheet);
        })();
    </script>
</body>
</html>
